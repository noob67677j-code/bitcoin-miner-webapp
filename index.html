<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Miner Tycoon Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <style>
        :root {
            --md-sys-color-background: #141218;
            --md-sys-color-on-background: #e6e1e5;
            --md-sys-color-surface: #211f26;
            --md-sys-color-surface-variant: #49454f;
            --md-sys-color-on-surface: #e6e1e5;
            --md-sys-color-on-surface-variant: #cac4d0;
            --md-sys-color-primary: #d0bcff;
            --md-sys-color-on-primary: #381e72;
            --md-sys-color-primary-container: #4f378b;
            --md-sys-color-secondary-container: #4a4458;
            --md-sys-color-on-secondary-container: #e8def8;
            --md-sys-color-error: #ffb4ab;
            --color-btc: #f2a900;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        header { padding: 20px 20px 10px 20px; text-align: center; background: linear-gradient(180deg, rgba(33,31,38,1) 0%, rgba(20,18,24,0) 100%); }
        .balance-title { font-size: 13px; color: var(--md-sys-color-on-surface-variant); letter-spacing: 1px; text-transform: uppercase; }
        .balance-value { font-size: 34px; font-weight: 700; color: var(--color-btc); margin-top: 5px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        
        .stats-strip { display: flex; gap: 10px; margin-top: 15px; justify-content: center; }
        .stat-chip {
            background: var(--md-sys-color-surface); padding: 8px 14px; border-radius: 12px;
            font-size: 12px; display: flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,0.03);
        }
        .stat-chip .label { color: var(--md-sys-color-on-surface-variant); }
        .stat-chip .val { font-weight: 500; color: #fff; }

        .main-content { flex: 1; overflow-y: auto; padding: 10px 20px 100px 20px; }
        .screen { display: none; animation: fadeIn 0.25s ease; }
        .screen.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* КЛИКЕР */
        #screen-clicker { text-align: center; padding-top: 30px; }
        .click-btn {
            width: 210px; height: 210px; border-radius: 50%; background: radial-gradient(circle, #f5b942 0%, #f2a900 100%);
            box-shadow: 0 12px 35px rgba(242, 169, 0, 0.25), inset 0 -8px 15px rgba(0,0,0,0.2);
            border: 6px solid var(--md-sys-color-surface); margin: 0 auto 35px auto;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.05s ease;
        }
        .click-btn:active { transform: scale(0.94); }
        .click-btn span { font-size: 85px; color: #141218; }
        
        .energy-container { width: 100%; max-width: 280px; margin: 0 auto; background: var(--md-sys-color-surface-variant); height: 10px; border-radius: 5px; overflow: hidden; }
        .energy-bar { height: 100%; background: var(--md-sys-color-primary); width: 100%; transition: width 0.1s linear; }
        .energy-text { font-size: 13px; margin-top: 8px; color: var(--md-sys-color-on-surface-variant); display: flex; align-items: center; justify-content: center; gap: 4px; }

        /* ФЕРМА */
        .farm-header { background: var(--md-sys-color-surface); padding: 15px; border-radius: 16px; margin-bottom: 15px; font-size: 14px; text-align: center; color: var(--md-sys-color-on-surface-variant); }
        .slots-grid { display: flex; flex-direction: column; gap: 10px; }
        .slot-card {
            display: flex; align-items: center; gap: 15px; background: var(--md-sys-color-surface); 
            border-radius: 16px; padding: 14px 18px; border: 1px solid var(--md-sys-color-surface-variant);
        }
        .slot-card.active { border-color: var(--color-btc); background: linear-gradient(90deg, #211f26 0%, #292115 100%); }
        .slot-card .gpu-icon { font-size: 32px; color: var(--md-sys-color-on-surface-variant); }
        .slot-card.active .gpu-icon { color: var(--color-btc); }
        .slot-card .gpu-meta { flex: 1; }
        .slot-card .gpu-name { font-weight: 500; font-size: 15px; }
        .slot-card .gpu-profit { font-size: 12px; color: var(--md-sys-color-on-surface-variant); margin-top: 2px; }
        
        .delete-btn {
            background: none; border: none; color: var(--md-sys-color-error); cursor: pointer;
            display: flex; align-items: center; justify-content: center; padding: 8px; border-radius: 50%;
        }
        .delete-btn:active { background: rgba(255, 180, 171, 0.1); }

        /* ПРОКАЧКА */
        .sub-nav { display: flex; background: var(--md-sys-color-surface); padding: 4px; border-radius: 12px; margin-bottom: 15px; gap: 2px; }
        .sub-nav-btn { flex: 1; background: none; border: none; padding: 10px 5px; color: var(--md-sys-color-on-surface-variant); border-radius: 9px; cursor: pointer; font-weight: 500; font-size: 13px; }
        .sub-nav-btn.active { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-secondary-container); }
        
        .upgrade-list { display: flex; flex-direction: column; gap: 10px; }
        .upgrade-card {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--md-sys-color-surface); padding: 14px 16px; border-radius: 16px;
            border: 1px solid var(--md-sys-color-surface-variant);
        }
        .upgrade-info { display: flex; flex-direction: column; gap: 3px; max-width: 65%; }
        .upgrade-title { font-weight: 500; font-size: 15px; }
        .upgrade-desc { font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
        .upgrade-btn {
            background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
            border: none; padding: 10px 14px; border-radius: 20px; font-weight: 500; font-size: 13px; cursor: pointer; white-space: nowrap;
        }
        .upgrade-btn:disabled { background: var(--md-sys-color-surface-variant); color: #777; cursor: not-allowed; }

        /* НАВИГАЦИЯ */
        nav.bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0; height: 80px;
            background-color: var(--md-sys-color-surface); display: flex;
            justify-content: space-around; align-items: center; padding: 0 10px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3); border-top: 1px solid rgba(255,255,255,0.03);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--md-sys-color-on-surface-variant); cursor: pointer; flex: 1; height: 100%; }
        .nav-icon-wrapper { padding: 4px 20px; border-radius: 16px; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s ease; margin-bottom: 4px; }
        .nav-item.active .nav-icon-wrapper { background-color: var(--md-sys-color-secondary-container); }
        .nav-item.active { color: var(--md-sys-color-on-surface); font-weight: 500; }
        .nav-item span.material-symbols-rounded { font-size: 24px; }
        .nav-label { font-size: 11px; }
    </style>
</head>
<body>

    <header>
        <div class="balance-title">Баланс</div>
        <div class="balance-value">
            <span class="material-symbols-rounded" style="color: var(--color-btc)">currency_bitcoin</span>
            <span id="btc">0.00</span>
        </div>
        <div class="stats-strip">
            <div class="stat-chip">
                <span class="material-symbols-rounded" style="font-size:14px; color:var(--color-btc)">bolt</span>
                <span class="label">Тап:</span>
                <span class="val" id="info-tap">+0.5</span>
            </div>
            <div class="stat-chip">
                <span class="material-symbols-rounded" style="font-size:14px; color:var(--md-sys-color-primary)">memory</span>
                <span class="label">В сек:</span>
                <span class="val" id="info-pps">0.0</span>
            </div>
        </div>
    </header>

    <div class="main-content">
        <div id="screen-clicker" class="screen active">
            <div class="click-btn" onclick="handleClick(event)">
                <span class="material-symbols-rounded">touch_app</span>
            </div>
            <div class="energy-container">
                <div class="energy-bar" id="energy-bar"></div>
            </div>
            <div class="energy-text">
                <span class="material-symbols-rounded" style="font-size: 15px; color: var(--md-sys-color-primary)">bolt</span>
                <span id="energy-val">100</span> / 100
            </div>
        </div>

        <div id="screen-farm" class="screen">
            <div class="farm-header">
                Занято слотов: <span id="farm-slots" style="color:#fff; font-weight:500;">0/5</span>
            </div>
            <div class="slots-grid" id="slots-grid"></div>
        </div>

        <div id="screen-upgrades" class="screen">
            <div class="sub-nav">
                <button class="sub-nav-btn active" id="sub-btn-gpus" onclick="switchSubTab('gpus')">Видеокарты</button>
                <button class="sub-nav-btn" id="sub-btn-income" onclick="switchSubTab('income')">Заработок</button>
                <button class="sub-nav-btn" id="sub-btn-slots" onclick="switchSubTab('slots')">Слоты</button>
            </div>

            <div id="tab-gpus" class="upgrade-list"></div>

            <div id="tab-income" class="upgrade-list" style="display: none;">
                <div class="upgrade-card">
                    <div class="upgrade-info">
                        <div class="upgrade-title">Улучшить Тап</div>
                        <div class="upgrade-desc">Сила клика: +0.2 BTC</div>
                    </div>
                    <button class="upgrade-btn" id="btn-buy-click" onclick="buyClickUpgrade()">15 BTC</button>
                </div>
                <div class="upgrade-card">
                    <div class="upgrade-info">
                        <div class="upgrade-title">Нанять Сисадмина</div>
                        <div class="upgrade-desc" id="autoclicker-desc">Авто-клик каждые 2 сек (Тратит по 2 энергии)</div>
                    </div>
                    <button class="upgrade-btn" id="btn-buy-autoclicker" onclick="buyAutoclicker()">250 BTC</button>
                </div>
            </div>

            <div id="tab-slots" class="upgrade-list" style="display: none;">
                <div class="upgrade-card">
                    <div class="upgrade-info">
                        <div class="upgrade-title">Добавить слот</div>
                        <div class="upgrade-desc">Максимум 15 слотов</div>
                    </div>
                    <button class="upgrade-btn" id="btn-upgrade-slots" onclick="upgradeSlots()">50 BTC</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-bar">
        <div class="nav-item active" onclick="switchScreen('clicker', this)">
            <div class="nav-icon-wrapper"><span class="material-symbols-rounded">ads_click</span></div>
            <div class="nav-label">Кликер</div>
        </div>
        <div class="nav-item" onclick="switchScreen('farm', this)">
            <div class="nav-icon-wrapper"><span class="material-symbols-rounded">dns</span></div>
            <div class="nav-label">Ферма</div>
        </div>
        <div class="nav-item" onclick="switchScreen('upgrades', this)">
            <div class="nav-icon-wrapper"><span class="material-symbols-rounded">upgrade</span></div>
            <div class="nav-label">Прокачка</div>
        </div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        const userId = tg.initDataUnsafe?.user?.id || 12345;

        const gpuList = [
            { name: "GTX 1660", income: 0.1, basePrice: 10, icon: "hardware" },
            { name: "RTX 3060", income: 0.4, basePrice: 45, icon: "memory" },
            { name: "RTX 4060", income: 1.2, basePrice: 120, icon: "developer_board" },
            { name: "RTX 4090", income: 3.5, basePrice: 380, icon: "blender" },
            { name: "Antminer S19", income: 10.0, basePrice: 1100, icon: "router" }
        ];

        let btc = 0;
        let gpuInventory = []; 
        let maxSlots = 5;
        let clickPower = 0.5;
        let energy = 100;
        let gpuBuyCounts = [0, 0, 0, 0, 0];
        let hasAutoclicker = 0;

        function switchScreen(screenId, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`screen-${screenId}`).classList.add('active');
            el.classList.add('active');
        }

        function switchSubTab(tabName) {
            document.querySelectorAll('.sub-nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`sub-btn-${tabName}`).classList.add('active');
            document.getElementById('tab-gpus').style.display = tabName === 'gpus' ? 'flex' : 'none';
            document.getElementById('tab-income').style.display = tabName === 'income' ? 'flex' : 'none';
            document.getElementById('tab-slots').style.display = tabName === 'slots' ? 'flex' : 'none';
        }

        async function loadData() {
            try {
                let currentUserId = parseInt(userId) || 12345;
                let response = await fetch(`/get_user?user_id=${currentUserId}`);
                let data = await response.json();
                
                btc = parseFloat(data.btc) || 0;
                maxSlots = parseInt(data.max_slots) || 5;
                clickPower = parseFloat(data.click_power) || 0.5;
                energy = parseFloat(data.energy) || 100;
                hasAutoclicker = parseInt(data.has_autoclicker) || 0;
                
                if (data.gpu_inventory && data.gpu_inventory.trim() !== "") {
                    gpuInventory = data.gpu_inventory.split(',').map(Number);
                } else {
                    gpuInventory = [];
                }
                
                if (data.gpu_buy_counts && data.gpu_buy_counts.trim() !== "") {
                    gpuBuyCounts = data.gpu_buy_counts.split(',').map(Number);
                } else {
                    gpuBuyCounts = [0, 0, 0, 0, 0];
                }
                
                updateUI();

                if (data.offline_earnings && data.offline_earnings > 0) {
                    tg.showAlert(`С возвращением!\nПока тебя не было, твоя ферма принесла: ${data.offline_earnings.toFixed(2)} BTC (за ${data.offline_time_text})`);
                }
            } catch (e) { 
                console.error("Ошибка загрузки:", e); 
            }
        }

        async function saveData() {
            try {
                let currentUserId = parseInt(userId) || 12345;
                let gpuInventoryStr = gpuInventory.length > 0 ? gpuInventory.join(',') : "";
                let gpuBuyCountsStr = gpuBuyCounts.length > 0 ? gpuBuyCounts.join(',') : "0,0,0,0,0";

                let payload = {
                    user_id: currentUserId,
                    btc: parseFloat(btc), 
                    gpu_inventory: gpuInventoryStr, 
                    gpu_buy_counts: gpuBuyCountsStr,
                    max_slots: parseInt(maxSlots), 
                    click_power: parseFloat(clickPower), 
                    energy: parseFloat(energy),
                    has_autoclicker: parseInt(hasAutoclicker)
                };

                await fetch('/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) {
                console.error("Ошибка сохранения:", e);
            }
        }

        function calculatePassiveIncome() {
            return gpuInventory.reduce((sum, idx) => sum + gpuList[idx].income, 0);
        }

        function getGpuPrice(idx) {
            let counts = (gpuBuyCounts && gpuBuyCounts[idx] !== undefined) ? gpuBuyCounts[idx] : 0;
            return Math.round(gpuList[idx].basePrice * Math.pow(1.15, counts));
        }

        function countGpuInInventory(idx) {
            return gpuInventory.filter(id => id === idx).length;
        }

        function updateUI() {
            let passiveIncome = calculatePassiveIncome();
            document.getElementById('btc').innerText = btc.toFixed(2);
            
            let currentPower = clickPower || 0.5;
            document.getElementById('info-tap').innerText = `+${currentPower.toFixed(1)}`;
            document.getElementById('info-pps').innerText = passiveIncome.toFixed(1);

            let currentSlots = maxSlots || 5;
            document.getElementById('farm-slots').innerText = `${gpuInventory.length}/${currentSlots}`;
            
            const grid = document.getElementById('slots-grid');
            grid.innerHTML = '';
            for(let i = 0; i < currentSlots; i++) {
                const card = document.createElement('div');
                if (i < gpuInventory.length) {
                    let gpuIdx = gpuInventory[i];
                    let gpu = gpuList[gpuIdx];
                    card.className = 'slot-card active';
                    card.innerHTML = `
                        <span class="material-symbols-rounded gpu-icon">${gpu.icon}</span>
                        <div class="gpu-meta">
                            <div class="gpu-name">${gpu.name}</div>
                            <div class="gpu-profit">+${gpu.income} BTC/сек</div>
                        </div>
                        <button class="delete-btn" onclick="confirmDeleteGPU(${i}, '${gpu.name}')"><span class="material-symbols-rounded">delete</span></button>
                    `;
                } else {
                    card.className = 'slot-card';
                    card.innerHTML = `
                        <span class="material-symbols-rounded gpu-icon">grid_view</span>
                        <div class="gpu-meta"><div class="gpu-name" style="color:var(--md-sys-color-surface-variant)">Пустой слот</div></div>
                    `;
                }
                grid.appendChild(card);
            }

            const gpusTab = document.getElementById('tab-gpus');
            gpusTab.innerHTML = '';
            gpuList.forEach((gpu, idx) => {
                let price = getGpuPrice(idx);
                let isLocked = idx > 0 && countGpuInInventory(idx - 1) < 5;
                let lockReason = `Нужно 5 шт. ${gpuList[idx-1]?.name} (Есть: ${countGpuInInventory(idx - 1)})`;
                let isFull = gpuInventory.length >= currentSlots;

                const card = document.createElement('div');
                card.className = 'upgrade-card';
                card.innerHTML = `
                    <div class="upgrade-info">
                        <div class="upgrade-title" style="${isLocked ? 'color:var(--md-sys-color-surface-variant)' : ''}">${gpu.name}</div>
                        <div class="upgrade-desc">${isLocked ? lockReason : 'Доход: +' + gpu.income + ' BTC/сек'}</div>
                    </div>
                    <button class="upgrade-btn" ${isLocked || isFull ? 'disabled' : ''} onclick="buyGPU(${idx})">${isFull && !isLocked ? 'Нет мест' : price + ' BTC'}</button>
                `;
                gpusTab.appendChild(card);
            });

            let clickPrice = 15 + (currentPower - 0.5) * 60;
            document.getElementById('btn-buy-click').innerText = `${clickPrice.toFixed(0)} BTC`;

            let acBtn = document.getElementById('btn-buy-autoclicker');
            let acDesc = document.getElementById('autoclicker-desc');
            if (hasAutoclicker === 1) {
                acBtn.disabled = true;
                acBtn.innerText = "Нанят";
                acDesc.innerText = "Сисадмин работает и активно кликает за вас!";
            } else {
                acBtn.disabled = false;
                acBtn.innerText = "250 BTC";
            }

            let slotsPrice = 50 + (currentSlots - 5) * 125;
            document.getElementById('btn-upgrade-slots').innerText = `${slotsPrice} BTC`;
            document.getElementById('btn-upgrade-slots').disabled = currentSlots >= 15;
        }

        function handleClick(e) {
            if (energy >= 2) {
                energy -= 2; 
                btc += (clickPower || 0.5);
                document.getElementById('energy-val').innerText = Math.ceil(energy);
                document.getElementById('energy-bar').style.width = `${energy}%`;
                document.getElementById('btc').innerText = btc.toFixed(2);
                if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            }
        }

        function runAutoclicker() {
            if (hasAutoclicker === 1 && energy >= 2) {
                energy -= 2;
                btc += (clickPower || 0.5);
                document.getElementById('energy-val').innerText = Math.ceil(energy);
                document.getElementById('energy-bar').style.width = `${energy}%`;
                document.getElementById('btc').innerText = btc.toFixed(2);
            }
        }

        function buyAutoclicker() {
            if (btc >= 250 && hasAutoclicker === 0) {
                btc -= 250; hasAutoclicker = 1; updateUI(); saveData();
            }
        }

        function buyGPU(idx) {
            let price = getGpuPrice(idx);
            if (btc >= price && gpuInventory.length < maxSlots) {
                btc -= price; gpuInventory.push(idx); gpuBuyCounts[idx]++; updateUI(); saveData();
            }
        }

        function confirmDeleteGPU(inventoryIndex, gpuName) {
            tg.showConfirm(`Вы точно хотите удалить ${gpuName}? Место освободится, но доход упадет.`, (isConfirmed) => {
                if (isConfirmed) { gpuInventory.splice(inventoryIndex, 1); updateUI(); saveData(); }
            });
        }

        function buyClickUpgrade() {
            let currentPower = clickPower || 0.5;
            let price = 15 + (currentPower - 0.5) * 60;
            if (btc >= price) { btc -= price; clickPower = currentPower + 0.2; updateUI(); saveData(); }
        }

        function upgradeSlots() {
            let currentSlots = maxSlots || 5;
            let price = 50 + (currentSlots - 5) * 125;
            if (btc >= price && currentSlots < 15) { btc -= price; maxSlots = currentSlots + 1; updateUI(); saveData(); }
        }

        // Таймеры
        setInterval(() => {
            btc += calculatePassiveIncome();
            if (energy < 100) energy = Math.min(100, energy + (100 / 30));
            
            document.getElementById('btc').innerText = btc.toFixed(2);
            document.getElementById('energy-val').innerText = Math.floor(energy);
            document.getElementById('energy-bar').style.width = `${energy}%`;
        }, 1000);

        setInterval(runAutoclicker, 2000);
        setInterval(saveData, 8000);
        loadData();
    </script>
</body>
</html>
